<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Emerald Ribbon -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyber Indigo/Cyan Ribbon -->
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Center Nexus Glow -->
    <radialGradient id="nexus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with subtle stroke -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#334155" stroke-width="3" opacity="0.4" />

  <!-- Background radial subtle glow -->
  <circle cx="256" cy="200" r="180" fill="#10B981" opacity="0.12" filter="blur(40px)" />

  <!-- Left Pillar (Emerald) -->
  <rect x="110" y="130" width="56" height="252" rx="28" fill="url(#emerald-grad)" />

  <!-- Right Pillar (Cyber Indigo) -->
  <rect x="346" y="130" width="56" height="252" rx="28" fill="url(#indigo-grad)" />

  <!-- Left Diagonal Fold (Emerald to Center) -->
  <path d="M110 160 L166 130 L275 300 L220 330 Z" fill="url(#emerald-grad)" opacity="0.95" />

  <!-- Right Diagonal Fold (Indigo to Center) -->
  <path d="M402 160 L346 130 L237 300 L292 330 Z" fill="url(#indigo-grad)" opacity="0.95" />

  <!-- Glowing Interlocking Nexus -->
  <circle cx="256" cy="305" r="32" fill="#06B6D4" opacity="0.9" />
  <circle cx="256" cy="305" r="44" fill="url(#nexus-glow)" opacity="0.6" />

  <!-- Wealth Gold Dot Accent -->
  <circle cx="256" cy="305" r="14" fill="#FBBF24" />
  <circle cx="253" cy="302" r="4" fill="#FEF3C7" />
</svg>
